# docker-compose.yml
# This file orchestrates the frontend and backend services for the trading platform.

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # The backend container shares the host's network.
    # It will be accessible on localhost at the port specified in the .env file (e.g., 8000).
    network_mode: "host"
    volumes:
      # Mount a local directory for any persistent storage needs, like logs or cached data.
      - ./storage:/app/storage
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Expose the frontend's port (e.g., 3000) to the host machine.
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    extra_hosts:
      # This allows the frontend container to resolve 'host.docker.internal'
      # to the host machine's IP address, enabling it to reach the backend service.
      - "host.docker.internal:host-gateway"
    environment:
      # Pass the backend port to the frontend container so nginx can use it.
      - BACKEND_PORT=${BACKEND_PORT}
```docker
# backend/Dockerfile
# This file defines the environment for the Python FastAPI backend.

# Use an official Python runtime as a parent image
FROM python:3.10-slim

# Set the working directory in the container
WORKDIR /app

# Copy the requirements file into the container at /app
COPY ./requirements.txt /app/requirements.txt

# Install any needed packages specified in requirements.txt
# Using --no-cache-dir reduces the image size.
RUN pip install --no-cache-dir --upgrade -r /app/requirements.txt

# Copy the rest of the backend application's code into the container at /app
COPY . /app

# The command to run the application using uvicorn.
# It will listen on the port specified by the PORT environment variable.
# When using network_mode: "host", this binds directly to that port on the host machine.
CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
