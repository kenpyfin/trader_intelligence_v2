# frontend/Dockerfile
# This file builds the React frontend and serves it with Nginx.

# --- Build Stage ---
# Use a Node.js image to build the React application.
FROM node:18-alpine AS build

WORKDIR /app
COPY package*.json ./
RUN npm install
COPY . .
RUN npm run build

# --- Production Stage ---
# Use a lightweight Nginx image to serve the static files.
FROM nginx:1.25-alpine

# Copy the built application from the 'build' stage to the Nginx public directory.
COPY --from=build /app/build /usr/share/nginx/html

# Copy our custom Nginx configuration file.
COPY nginx.conf /etc/nginx/conf.d/default.conf

# Expose the port the frontend will run on (defined in .env).
# This is for documentation; the actual port mapping is in docker-compose.yml.
EXPOSE 3000

# The default Nginx command will start the server.
CMD ["nginx", "-g", "daemon off;"]
```nginx
# frontend/nginx.conf
# This configuration tells Nginx how to serve the React app and proxy API calls.

server {
    # Nginx will listen on the port specified by the FRONTEND_PORT env var.
    # Since envsubst is not used here for simplicity, we hardcode 3000,
    # which matches the EXPOSE instruction and the default in the .env file.
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Standard configuration for a React Single-Page Application (SPA)
    # to ensure client-side routing works correctly.
    location / {
        try_files $uri /index.html;
    }

    # This block proxies any request starting with /api/ to our backend service.
    # 'host.docker.internal' resolves to the host machine's IP.
    # The port (e.g., 8000) must match the port the backend is running on.
    location /api/ {
        # The port here should match the backend's port.
        proxy_pass http://host.docker.internal:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
