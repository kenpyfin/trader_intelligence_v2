# This file orchestrates the frontend and backend services for the trading platform.
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Build args can be used to pass dependency versions if needed
      # args:
      #   - BUILD_ENV=production
    # The backend container shares the host's network.
    # It will be accessible on localhost at the port specified in the .env file.
    network_mode: "host"
    volumes:
      # Mount the source code for hot-reloading during development
      - ./backend/src:/app/src
      - ./backend/my_libs_py3:/app/my_libs_py3
    env_file:
      - .env
    environment:
      # Prefer ib_async backend where available
      - BROKER_BACKEND=${BROKER_BACKEND:-ib_async}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Enable Docker BuildKit for better caching and performance
      # Use: DOCKER_BUILDKIT=1 docker-compose build
    ports:
      # Expose the frontend's port to the host machine.
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      # Pass environment variables to be used by nginx.conf
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BACKEND_PORT=${BACKEND_PORT}
    extra_hosts:
      # This allows the frontend container to resolve 'host.docker.internal'
      # to the host machine's IP address, enabling it to reach the backend service.
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
