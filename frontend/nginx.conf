server {
    # Nginx will listen on the port specified by the FRONTEND_PORT env var from docker-compose.
    listen ${FRONTEND_PORT};

    root /usr/share/nginx/html;
    index index.html;

    # Standard configuration for a React Single-Page Application (SPA)
    # to ensure client-side routing works correctly.
    # This will serve static files if they exist, otherwise it will fall back
    # to index.html, allowing the React router to handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # This block proxies any request starting with /api/ to our backend service.
    location /api/ {
        # Set longer timeouts to allow for slow, long-running analysis tasks.
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 'host.docker.internal' resolves to the host machine's IP, which is necessary
        # when the backend is running in "host" network mode.
        proxy_pass http://host.docker.internal:${BACKEND_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
